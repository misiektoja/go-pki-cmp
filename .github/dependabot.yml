# Keeps dependencies current without letting updates arrive faster than they can be reviewed.
#
# Go modules, GitHub Actions, the documentation toolchain and the EJBCA test images are grouped so one
# pull request carries a whole ecosystem's patch and minor updates. Major updates stay separate,
# because they need their own validation run. Container images are pinned by digest, so an image
# rebuilt under the same tag arrives as a pull request too.
version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The documentation toolchain is pinned in docs/requirements.txt and the site build runs with
  # --strict, so a MkDocs or theme release that changes a warning into an error breaks the build. That
  # is worth learning from a pull request rather than from the first push after a release.
  - package-ecosystem: pip
    directory: "/docs"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      docs-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The EJBCA and nginx images the client integration tests run against.
  - package-ecosystem: docker-compose
    directory: "/test/integration/ejbca"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: test
      include: scope
    groups:
      ejbca-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The base image of the Insta Certifier client image.
  - package-ecosystem: docker
    directory: "/test/integration/certifier"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: test
      include: scope
